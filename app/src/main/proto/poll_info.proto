syntax = "proto3";

package com.imeanttobe.consensusapp;

option java_package = "com.imeanttobe.consensusapp";
option java_multiple_files = true;

message PollInfo {
  int32 id = 1;
  string title = 2;
  bytes pk = 3;
  bytes encrypted_sk = 4;
  bytes iv = 5;
}

message PollInfoItems {
  repeated PollInfo items = 1;
}